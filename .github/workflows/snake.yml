name: generate contribution snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

concurrency:
  group: snake-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: akshaycpdev
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2310B981&color_dots=%232d3343,%23234b52,%230891B2,%2322D3EE,%2310B981
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%237C3AED&color_dots=%23ebedf0,%23c9d6ff,%2322D3EE,%230891B2,%237C3AED

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
